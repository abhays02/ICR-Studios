name: Documentation site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'data/samples/README.md'
      - 'studio/README.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'data/samples/README.md'
      - 'studio/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@v4.0.0
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_name == github.event.repository.default_branch
        with:
          path: docs/site/dist

  deploy:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pages
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "$(printf '%s: %s %s' Authorization Bearer "$GH_TOKEN")" \
            --header "Accept: application/vnd.github+json" \
            "$PAGES_API_URL")
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::warning::GitHub Pages is not enabled. Select GitHub Actions in Settings > Pages, then rerun this workflow with publishing enabled."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Failed to check GitHub Pages availability (HTTP $status)."
              exit 1
              ;;
          esac
      - name: Deploy static landing and documentation only
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4.0.5
