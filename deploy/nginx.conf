# Reference for an operator-managed nginx TLS ingress; provision certificates privately.
events {}
http {
    server_tokens off;
    access_log off;
    limit_req_zone $binary_remote_addr zone=icr_rate:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=icr_connections:10m;
    upstream icr_backend { server 127.0.0.1:8000; }
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/icr-tls/tls.crt;
        ssl_certificate_key /etc/icr-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 10m;
        client_body_timeout 30s;
        limit_req zone=icr_rate burst=30 nodelay;
        limit_req_status 429;
        limit_conn icr_connections 16;
        limit_conn_status 429;
        location / {
            proxy_pass http://icr_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 70s;
            proxy_send_timeout 35s;
        }
    }
}
